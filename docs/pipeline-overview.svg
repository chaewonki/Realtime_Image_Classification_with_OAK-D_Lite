<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">OAK-D Lite image-classification pipeline</title>
  <desc id="description">Six stages connect camera capture, frame extraction, MobileNetV2 training, OpenVINO conversion, blob compilation, and on-device inference.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1720"/>
      <stop offset="1" stop-color="#172938"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49d7ff"/>
      <stop offset="1" stop-color="#70f0c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6bdcf2"/>
    </marker>
  </defs>

  <rect width="1600" height="620" rx="28" fill="url(#background)"/>
  <text x="80" y="92" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="600">OAK-D Lite classification pipeline</text>
  <text x="80" y="137" fill="#a9bdca" font-family="Segoe UI, Arial, sans-serif" font-size="23">Capture → dataset → transfer learning → OpenVINO → FP16 Blob → device inference</text>

  <g stroke="#6bdcf2" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M 290 330 H 330"/>
    <path d="M 540 330 H 580"/>
    <path d="M 790 330 H 830"/>
    <path d="M 1040 330 H 1080"/>
    <path d="M 1290 330 H 1330"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(80 220)">
      <rect width="210" height="220" rx="18" fill="#172b3a" stroke="#3d6073" stroke-width="2"/>
      <circle cx="105" cy="68" r="34" fill="#203e4e" stroke="#49d7ff" stroke-width="4"/>
      <circle cx="105" cy="68" r="12" fill="#49d7ff"/>
      <text x="105" y="137" fill="#f4f8fb" text-anchor="middle" font-size="27" font-weight="600">Capture</text>
      <text x="105" y="174" fill="#a9bdca" text-anchor="middle" font-size="20">OAK-D video</text>
      <text x="105" y="202" fill="#70f0c2" text-anchor="middle" font-size="18">00_make_mp4.py</text>
    </g>

    <g transform="translate(330 220)">
      <rect width="210" height="220" rx="18" fill="#172b3a" stroke="#3d6073" stroke-width="2"/>
      <g fill="none" stroke="#49d7ff" stroke-width="4">
        <rect x="67" y="37" width="76" height="60" rx="6"/>
        <path d="M76 85 L98 62 L114 76 L127 58 L138 72"/>
      </g>
      <text x="105" y="137" fill="#f4f8fb" text-anchor="middle" font-size="27" font-weight="600">Extract</text>
      <text x="105" y="174" fill="#a9bdca" text-anchor="middle" font-size="20">Class folders</text>
      <text x="105" y="202" fill="#70f0c2" text-anchor="middle" font-size="18">00_extract_frames.py</text>
    </g>

    <g transform="translate(580 220)">
      <rect width="210" height="220" rx="18" fill="#172b3a" stroke="#3d6073" stroke-width="2"/>
      <g fill="none" stroke="#49d7ff" stroke-width="4">
        <circle cx="73" cy="67" r="11"/><circle cx="105" cy="45" r="11"/><circle cx="137" cy="67" r="11"/>
        <circle cx="86" cy="95" r="11"/><circle cx="124" cy="95" r="11"/>
        <path d="M82 61 L96 51 M114 51 L128 61 M80 76 L83 87 M130 76 L127 87 M84 72 L93 88 M126 72 L117 88"/>
      </g>
      <text x="105" y="137" fill="#f4f8fb" text-anchor="middle" font-size="27" font-weight="600">Train</text>
      <text x="105" y="174" fill="#a9bdca" text-anchor="middle" font-size="20">MobileNetV2</text>
      <text x="105" y="202" fill="#70f0c2" text-anchor="middle" font-size="18">01_train_model.py</text>
    </g>

    <g transform="translate(830 220)">
      <rect width="210" height="220" rx="18" fill="#172b3a" stroke="#3d6073" stroke-width="2"/>
      <path d="M65 50 H128 L148 70 V105 H65 Z" fill="none" stroke="#49d7ff" stroke-width="4"/>
      <path d="M128 50 V71 H148" fill="none" stroke="#49d7ff" stroke-width="4"/>
      <text x="106" y="91" fill="#49d7ff" text-anchor="middle" font-size="22" font-weight="600">IR</text>
      <text x="105" y="137" fill="#f4f8fb" text-anchor="middle" font-size="27" font-weight="600">Convert</text>
      <text x="105" y="174" fill="#a9bdca" text-anchor="middle" font-size="20">OpenVINO IR</text>
      <text x="105" y="202" fill="#70f0c2" text-anchor="middle" font-size="18">02_IR_conversion.sh</text>
    </g>

    <g transform="translate(1080 220)">
      <rect width="210" height="220" rx="18" fill="#172b3a" stroke="#3d6073" stroke-width="2"/>
      <rect x="64" y="43" width="82" height="70" rx="10" fill="none" stroke="#49d7ff" stroke-width="4"/>
      <path d="M78 32 V43 M96 32 V43 M114 32 V43 M132 32 V43 M78 113 V124 M96 113 V124 M114 113 V124 M132 113 V124" stroke="#49d7ff" stroke-width="4"/>
      <text x="105" y="84" fill="#49d7ff" text-anchor="middle" font-size="20" font-weight="600">FP16</text>
      <text x="105" y="149" fill="#f4f8fb" text-anchor="middle" font-size="27" font-weight="600">Compile</text>
      <text x="105" y="180" fill="#a9bdca" text-anchor="middle" font-size="20">Myriad Blob</text>
      <text x="105" y="207" fill="#70f0c2" text-anchor="middle" font-size="18">03_make_blob.py</text>
    </g>

    <g transform="translate(1330 220)">
      <rect width="190" height="220" rx="18" fill="#183343" stroke="url(#accent)" stroke-width="3"/>
      <rect x="49" y="39" width="92" height="72" rx="12" fill="none" stroke="#70f0c2" stroke-width="4"/>
      <circle cx="78" cy="75" r="13" fill="none" stroke="#70f0c2" stroke-width="4"/>
      <circle cx="116" cy="75" r="13" fill="none" stroke="#70f0c2" stroke-width="4"/>
      <text x="95" y="149" fill="#f4f8fb" text-anchor="middle" font-size="27" font-weight="600">Deploy</text>
      <text x="95" y="180" fill="#a9bdca" text-anchor="middle" font-size="20">Live inference</text>
      <text x="95" y="207" fill="#70f0c2" text-anchor="middle" font-size="18">04_use_blob.py</text>
    </g>
  </g>

  <rect x="80" y="505" width="1440" height="2" fill="#2c4859"/>
  <text x="80" y="554" fill="#a9bdca" font-family="Segoe UI, Arial, sans-serif" font-size="19">Verified against the repository's six-stage script sequence. This diagram is an architecture overview, not a fabricated runtime result.</text>
</svg>

